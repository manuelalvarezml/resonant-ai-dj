[project]
name = "prompt-to-playlist"
version = "0.2.0"
description = "Provider-neutral prompt interpretation and deterministic catalog retrieval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
prompt-playlist = "prompt_to_playlist.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_to_playlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
