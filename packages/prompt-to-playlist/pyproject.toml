[project]
name = "prompt-to-playlist"
version = "0.4.0"
description = "PlaylistIQ: provider-neutral prompt interpretation and deterministic catalog retrieval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
semantic = [
    "muq==0.1.0",
    "transformers>=4.45,<5",
    "huggingface-hub>=0.34,<1",
]
analysis = [
    "beat-this==1.1.0",
    "essentia-tensorflow==2.1b6.dev1389",
    "numpy>=2.5,<3",
    "psutil>=7,<8",
    # Beat This 1.1 falls back to SoundFile when Torchaudio 2.11 has no
    # TorchCodec decoder. Keep this explicit so MP3 rhythm analysis works.
    "soundfile>=0.13,<1",
    "torch==2.13.0",
    "torchaudio==2.11.0",
]
specialists = [
    "hear21passt==0.0.26",
    "timm==0.4.12",
]
supervised = [
    "mir-eval==0.8.2",
    "music21==9.3.0",
    "pretty-midi==0.2.10",
    "pyyaml==6.0.3",
    "setuptools==80.9.0",
]

[project.scripts]
prompt-playlist = "prompt_to_playlist.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_to_playlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
